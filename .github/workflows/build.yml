name: Build mod

on:
  push:
    branches: [main, master, 'wip-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain 2>&1 | tee build.log

      - name: Save build log to branch build-logs
        if: always()
        shell: bash
        run: |
          cp build.log /tmp/build.log || echo "sin log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf . -q
          cp /tmp/build.log build.log
          git add build.log
          git commit -q -m "build log"
          git push -f origin build-logs

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dedsafio3-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Publish releases (solo desde main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          for TAG in "v$VERSION" latest; do
            gh release delete "$TAG" --cleanup-tag --yes || true
            gh release create "$TAG" "$JAR" \
              --title "Dedsafio 3 (fan mod) $VERSION" \
              --notes-file RELEASE_NOTES.md
          done
